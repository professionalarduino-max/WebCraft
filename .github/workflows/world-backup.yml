name: Backup the multiplayer world

# Free hosting plans wipe their disk on every restart, so this job copies the
# live world out of the running server and stores it in the "world" branch.
# The server pulls it back at boot through --db-url (see render.yaml).
#
# Setup: none needed - it points at https://webcraft-h4g9.onrender.com by default.
# Want another server? Settings -> Secrets and variables -> Actions -> Variables
# -> New repository variable:  APP_URL = https://your-server
# Runs every 20 minutes; only real changes (a new build) create a commit.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      # works out of the box: the live server address is the default below.
      # To change it later, add a repository variable APP_URL (Settings ->
      # Secrets and variables -> Actions -> Variables) and it wins over this.
      APP_URL: ${{ vars.APP_URL || 'https://webcraft-h4g9.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the world snapshot
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL variable is not set - skipping"; exit 0; fi
          mkdir -p /tmp/world
          # the world can hold hundreds of thousands of edits, so it travels
          # gzipped (?gz=1). The .gz bytes are stored as-is; the game server
          # detects the gzip header on boot and unpacks them.
          code=""
          for try in 1 2 3; do
            code=$(curl -s -o /tmp/world/db.json.gz -w '%{http_code}' --max-time 180 "$APP_URL/export?gz=1" || true)
            echo "attempt $try: GET $APP_URL/export?gz=1 -> $code"
            [ "$code" = "200" ] && break
            sleep 15
          done
          test "$code" = "200" || { echo "server not reachable (asleep?) - keeping the previous backup"; exit 0; }
          test "$(head -c2 /tmp/world/db.json.gz | xxd -p)" = "1f8b" || { echo "that is not gzip - keeping the previous backup"; exit 0; }
          gunzip -c /tmp/world/db.json.gz > /tmp/world/db.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/world/db.json'))
          print('world format v%s' % d.get('v', 1))
          print('edits:', len(d.get('deltas', [])), 'seed:', d.get('seed'), 'ops:', d.get('ops'))
          print('claims:', len(d.get('claims', [])), 'locks:', len(d.get('locks', [])),
                'bans:', len(d.get('bans', [])), 'teams:', len(d.get('teams', [])))
          PY
          ls -la /tmp/world/

      - name: Store it in the 'world' branch (only when the build changed)
        run: |
          git config user.name  "webcraft-backup[bot]"
          git config user.email "webcraft-backup@users.noreply.github.com"

          # signature of the build: block edits, seed and operators (time/weather
          # change constantly, so they are ignored to avoid commit noise)
          cat > /tmp/sig.py <<'PY'
          import json, sys
          DIMS = {0: 'overworld', 1: 'nether', 2: 'end'}
          d = json.load(open(sys.argv[1]))
          edits = []
          for e in d.get('deltas', []):
            if isinstance(e, list):            # compact row: [dim, x, y, z, id, f?]
              dim, x, y, z, eid = DIMS.get(e[0], 'overworld'), e[1], e[2], e[3], e[4]
              f = e[5] if len(e) > 5 else ''
            else:
              dim, x, y, z, eid, f = e.get('dim'), e.get('x'), e.get('y'), e.get('z'), e.get('id'), e.get('f', '')
            edits.append(f"{dim}:{x},{y},{z}={eid}/{f}")
          edits.sort()
          print(json.dumps([d.get('seed'), edits, sorted(d.get('ops', [])),
                            json.dumps(d.get('claims', []), sort_keys=True),
                            json.dumps(d.get('locks', []), sort_keys=True),
                            json.dumps(d.get('bans', []), sort_keys=True)]))
          PY
          NEW=$(python3 /tmp/sig.py /tmp/world/db.json)

          git fetch origin world --depth=1 2>/dev/null || true
          if git show-ref -q refs/remotes/origin/world; then
            git show origin/world:server/db.json > /tmp/prev.json 2>/dev/null || echo '{}' > /tmp/prev.json
            OLD=$(python3 /tmp/sig.py /tmp/prev.json)
            if [ "$OLD" = "$NEW" ]; then echo "world unchanged, nothing to store"; exit 0; fi
          fi

          git checkout --orphan world-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p server
          cp /tmp/world/db.json.gz server/db.json
          git add -f server/db.json
          git commit -m "world backup $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f origin world-tmp:world
